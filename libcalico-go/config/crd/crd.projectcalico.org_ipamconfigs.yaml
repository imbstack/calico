apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: ipamconfigs.crd.projectcalico.org
spec:
  group: crd.projectcalico.org
  names:
    kind: IPAMConfig
    listKind: IPAMConfigList
    plural: ipamconfigs
    singular: ipamconfig
  preserveUnknownFields: false
  scope: Cluster
  versions:
    - name: v1
      schema:
        openAPIV3Schema:
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              properties:
                autoAllocateBlocks:
                  type: boolean
                ipCooldownSeconds:
                  description: |-
                    IPCooldownSeconds is the minimum age of a released IP in a block before it is re-used.
                    If set to zero, IPs can be re-used immediately (but are still handled with a FIFO queue to
                    minimize immediate reuse).
                  maximum: 1200
                  minimum: 0
                  type: integer
                kubeVirtVMAddressPersistence:
                  enum:
                    - Enabled
                    - Disabled
                  type: string
                maxBlocksPerHost:
                  maximum: 2147483647
                  minimum: 0
                  type: integer
                strictAffinity:
                  type: boolean
              required:
                - autoAllocateBlocks
                - strictAffinity
              type: object
          type: object
      served: true
      storage: true
